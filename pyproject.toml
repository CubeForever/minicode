[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode"
version = "0.9.1"
description = "A Claude Code-style terminal coding agent — zero dependencies, works with OpenAI-compatible & Anthropic APIs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
minicode = "minicode.cli:main"

[tool.setuptools.packages.find]
include = ["minicode*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E401"]
