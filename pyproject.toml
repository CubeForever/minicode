[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode"
version = "0.9.0"
description = "A Claude Code-style terminal coding agent — zero dependencies, works with OpenAI-compatible & Anthropic APIs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
minicode = "minicode.cli:main"

[tool.setuptools.packages.find]
include = ["minicode*"]
