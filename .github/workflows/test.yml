name: tests

on: [push, pull_request]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-cov
      - run: pip install .
      - name: run tests (captured)
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 -m pytest tests -q --cov=minicode --cov-report=term 2>&1 | tee pytest.log
      - name: debug annotations
        if: failure()
        shell: bash
        run: |
          {
            echo "python: $(python --version 2>&1); stdout-enc: $(python -X utf8 -c 'import sys; print(sys.stdout.encoding)')"
            echo "pip: $(pip list 2>/dev/null | grep -iE 'pytest|cov|coverage' | tr '\n' '|')"
          } > dbg.txt
          tail -n 40 pytest.log >> dbg.txt 2>/dev/null || echo "(no pytest.log)" >> dbg.txt
          # 崩溃式失败（无失败摘要）时用 -v 重跑，定位卡死的用例
          python -X utf8 -m pytest tests -v -x --tb=short -p no:cacheprovider 2>&1 | tail -n 60 >> dbg.txt || true
          flat=$(tr '\n' '|' < dbg.txt | sed 's/%/%25/g')
          echo "$flat" | fold -w 380 > dbg-chunks.txt
          n=0
          while IFS= read -r chunk; do
            n=$((n+1))
            echo "::error title=minicode-dbg-$n::$chunk"
          done < dbg-chunks.txt
      - run: python -m minicode --version
      - name: offline smoke (fake LLM)
        shell: bash
        run: |
          export MINICODE_FAKE_LLM=demo
          cd "$(mktemp -d)"
          python -m minicode -p "hi" --yolo
