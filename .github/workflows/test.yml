name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-cov
      - run: pip install .
      - name: run tests (captured)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --cov=minicode --cov-report=term 2>&1 | tee pytest.log
      - name: debug summary
        if: always()
        shell: bash
        run: |
          {
            echo "### environment"
            python --version 2>&1
            pip list 2>/dev/null | grep -iE "pytest|cov|coverage|ruff" || true
            echo "### pytest output (tail 150)"
            tail -n 150 pytest.log 2>/dev/null || echo "(no log)"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: python -m minicode --version
      - name: offline smoke (fake LLM)
        shell: bash
        run: |
          export MINICODE_FAKE_LLM=demo
          cd "$(mktemp -d)"
          python -m minicode -p "hi" --yolo
