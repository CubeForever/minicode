name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-cov
      - run: python -m pytest tests -q --cov=minicode --cov-report=term
      - run: python -m minicode --version
      - name: offline smoke (fake LLM)
        shell: bash
        run: |
          export MINICODE_FAKE_LLM=demo
          cd "$(mktemp -d)"
          python -m minicode -p "hi" --yolo
