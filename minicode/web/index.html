<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minicode</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="sr" class="visually-hidden" role="status" aria-live="polite"></div>

<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <span class="mark">❯</span>
    <span class="name">minicode</span>
    <span class="ver mono">v__VERSION__</span>
  </div>

  <div class="side-actions">
    <button id="btnExt" class="side-btn ghost" aria-label="打开扩展面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      扩展
    </button>
    <button id="btnNew" class="side-btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新会话
    </button>
  </div>

  <button class="ws-current" id="wsCurrent" title="切换 / 管理工作区" aria-label="切换或管理工作区">
    <svg class="ws-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    <span class="ws-path mono" id="wsPath">…</span>
    <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 15 12 20 17 15"/><polyline points="7 9 12 4 17 9"/></svg>
  </button>

  <div class="side-section">
    <div class="side-label mono">历史会话</div>
    <div class="session-list" id="sessions" role="list">
      <div class="side-empty">暂无历史会话</div>
    </div>
  </div>

  <div class="side-foot">
    <span class="mono">本地运行 · 零依赖</span>
    <button id="btnSettings" class="side-settings" title="模型 API 配置" aria-label="打开模型设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      设置
    </button>
  </div>
</aside>
<div class="side-mask" id="sideMask"></div>

<div class="stage">
  <header class="topbar">
    <button class="iconbtn menu" id="btnMenu" title="会话列表" aria-label="打开会话列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button id="model" class="model-badge mono" title="模型 API 配置">…</button>
    <div class="head-right">
      <div class="ctx" title="上下文占用">
        <div class="ctxbar"><div id="ctxFill" class="ctxfill"></div></div>
        <span id="ctxText" class="small dim mono">…</span>
      </div>
      <button id="btnTheme" class="iconbtn" title="切换明暗主题" aria-label="切换明暗主题">
        <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button id="btnCompact" class="iconbtn" title="压缩上下文" aria-label="压缩上下文">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
      </button>
    </div>
  </header>

  <main id="scroller">
    <button id="jumpDown" hidden aria-label="回到底部">↓</button>
    <div id="chat" role="log" aria-live="polite" aria-label="对话消息">
      <div id="hero">
        <div class="eyebrow mono">minicode — terminal coding agent</div>
        <h1 class="hero-title">把任务，交给<em>终端</em>。</h1>
        <p class="hero-sub">读写代码、执行命令、跑测试。<br>你说，它做。</p>
        <ol class="tasklist">
          <li><button class="chip" data-prompt="总结这个项目的目录结构与核心模块，并生成 MINICODE.md"><span class="idx mono">01</span><span class="t">生成项目说明 MINICODE.md</span><span class="arr">→</span></button></li>
          <li><button class="chip" data-prompt="审查本会话最近的代码改动，按严重程度列出问题清单"><span class="idx mono">02</span><span class="t">审查本会话的代码改动</span><span class="arr">→</span></button></li>
          <li><button class="chip" data-prompt="运行项目的测试，如果有失败就自动修复"><span class="idx mono">03</span><span class="t">跑测试并修复失败项</span><span class="arr">→</span></button></li>
          <li><button class="chip" data-prompt="解释这个项目核心模块的设计思路和关键数据流"><span class="idx mono">04</span><span class="t">解释核心模块设计</span><span class="arr">→</span></button></li>
        </ol>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="planbar" id="planBar" hidden>
      <span class="mono">PLAN READY</span>
      <span class="dim">计划已生成，确认后将切换到自动接受编辑并开始实施</span>
      <button id="btnApprovePlan" class="btn primary">批准并实施</button>
    </div>
    <div class="cmdhint" id="cmdHint" hidden></div>
    <div class="input-card">
      <div class="input-line">
        <textarea id="input" rows="1" placeholder="输入任务、/命令 或 !命令…"></textarea>
        <button id="btnStop" class="send stop" title="停止当前回合（Esc）" aria-label="停止当前回合" hidden>■</button>
        <button id="btnSend" class="send" title="发送" aria-label="发送">↑</button>
      </div>
      <div class="composer-row mono">
        <span class="st"><span id="conn" class="conn"></span><span id="connText">已连接</span></span>
        <select id="modeSel" title="权限模式">
          <option value="default">确认模式</option>
          <option value="accept-edits">自动接受编辑</option>
          <option value="plan">计划模式</option>
          <option value="full-access">完全访问</option>
        </select>
        <span class="grow"></span>
        <span id="usage" title="累计输入 / 输出 tokens · 上下文占用"></span>
      </div>
    </div>
  </footer>
</div>

<!-- 模型 API 设置 -->
<div class="modal" role="dialog" aria-modal="true" id="settingsModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b>模型 API</b><button class="iconbtn" data-close aria-label="关闭">✕</button></div>
    <div class="form">
      <label>提供方
        <select id="cfgProvider">
          <option value="openai">OpenAI 兼容（GLM / DeepSeek / Kimi…）</option>
          <option value="anthropic">Anthropic</option>
        </select>
      </label>
      <label>Base URL <input id="cfgBase" class="mono" placeholder="https://api.openai.com/v1"></label>
      <label>API Key
        <span class="key-wrap">
          <input id="cfgKey" class="mono" type="password" placeholder="留空则不修改" autocomplete="off">
          <button type="button" class="key-toggle" id="cfgKeyToggle" aria-label="显示或隐藏密钥" title="显示 / 隐藏">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </span>
      </label>
      <label>模型 <input id="cfgModel" class="mono" placeholder="glm-4.6 / claude-sonnet-4-5"></label>
      <div class="form-2col">
        <label>max_tokens <input id="cfgMax" type="number" min="256"></label>
        <label>上下文上限 <input id="cfgCtx" type="number" min="4096"></label>
      </div>
      <label>思考力度
        <select id="cfgEffort">
          <option value="">默认</option><option value="low">low</option>
          <option value="medium">medium</option><option value="high">high</option>
        </select>
      </label>
      <div class="row">
        <button id="btnProbe" class="btn ghost">测试连接</button>
        <span id="probeOut" class="mono dim small"></span>
      </div>
      <label class="chk"><input type="checkbox" id="cfgSave"> 保存到 ~/.minicode.json（含密钥，谨慎勾选）</label>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button id="btnSaveCfg" class="btn primary">保存并重连</button>
    </div>
  </div>
</div>

<!-- 扩展面板：技能 / 插件 / 子智能体 / 自定义命令 / MCP（分页签管理） -->
<div class="modal" role="dialog" aria-modal="true" id="extModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b>扩展</b><button class="iconbtn" data-close aria-label="关闭">✕</button></div>
    <div class="ext-tabs mono" id="extTabs"></div>
    <div class="ext-toolbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="extSearch" placeholder="筛选当前扩展…" spellcheck="false">
    </div>
    <div class="ext-body" id="extBody">
      <div class="side-empty">加载中…</div>
    </div>
  </div>
</div>

<!-- 工作区管理 -->
<div class="modal" role="dialog" aria-modal="true" id="wsModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b>工作区</b><button class="iconbtn" data-close aria-label="关闭">✕</button></div>
    <div class="form">
      <p class="dim small">智能体的读写被锁定在当前工作区内；切换工作区会开始新会话。</p>
      <div class="ws-list" id="wsList"></div>
      <div class="row">
        <button id="btnBrowse" class="btn ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          浏览目录…
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 服务端目录浏览器 -->
<div class="modal" role="dialog" aria-modal="true" id="dirModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b>选择工作区目录</b><button class="iconbtn" data-close aria-label="关闭">✕</button></div>
    <div class="dir-body">
      <div class="dir-bar">
        <button id="dirUp" class="iconbtn" title="上一级" aria-label="上一级">↑</button>
        <input id="dirPath" class="mono" placeholder="绝对路径" spellcheck="false">
        <button id="dirGo" class="btn ghost">跳转</button>
      </div>
      <div class="dir-list" id="dirList"><div class="side-empty">加载中…</div></div>
      <div class="modal-foot">
        <button class="btn ghost" data-close>取消</button>
        <button id="dirSelect" class="btn primary">选择此目录</button>
      </div>
    </div>
  </div>
</div>

<!-- 扩展新建表单 -->
<div class="modal" role="dialog" aria-modal="true" id="formModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b id="formTitle">新建</b><button class="iconbtn" data-close aria-label="关闭">✕</button></div>
    <div class="form" id="formFields"></div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button id="formSubmit" class="btn primary">创建</button>
    </div>
  </div>
</div>

<!-- 扩展详情 -->
<div class="modal" role="dialog" aria-modal="true" id="detailModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b>扩展详情</b><button class="iconbtn" data-close aria-label="关闭">✕</button></div>
    <div class="detail-body" id="detailBody">
      <div class="side-empty">加载中…</div>
    </div>
  </div>
</div>

<!-- 通用列表（回退选择等） -->
<div class="modal" role="dialog" aria-modal="true" id="listModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b id="listTitle">选择</b><button class="iconbtn" data-close aria-label="关闭">✕</button></div>
    <div class="modal-hint dim small" id="listHint"></div>
    <div class="pick-list" id="pickList"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
