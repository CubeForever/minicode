<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minicode</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <span class="mark">❯</span>
    <span class="name">minicode</span>
    <span class="ver mono">v__VERSION__</span>
  </div>
  <button class="newchat" id="btnNew">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新会话
  </button>
  <div class="side-section">
    <div class="side-label mono">历史会话</div>
    <div class="session-list" id="sessions">
      <div class="side-empty">暂无历史会话</div>
    </div>
  </div>
  <div class="side-foot mono">本地运行 · 零依赖</div>
</aside>
<div class="side-mask" id="sideMask"></div>

<div class="stage">
  <header class="topbar">
    <button class="iconbtn menu" id="btnMenu" title="会话列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span id="model" class="model-badge mono" title="当前模型">…</span>
    <div class="head-right">
      <div class="ctx" title="上下文占用">
        <div class="ctxbar"><div id="ctxFill" class="ctxfill"></div></div>
        <span id="ctxText" class="small dim mono">…</span>
      </div>
      <button id="btnTheme" class="iconbtn" title="切换明暗主题">
        <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button id="btnCompact" class="iconbtn" title="压缩上下文">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
      </button>
    </div>
  </header>

  <main id="scroller">
    <div id="chat">
      <div id="hero">
        <div class="eyebrow mono">minicode — terminal coding agent</div>
        <h1 class="hero-title">把任务，交给<em>终端</em>。</h1>
        <p class="hero-sub">读写代码、执行命令、跑测试。<br>你说，它做。</p>
        <ol class="tasklist">
          <li><button class="chip" data-prompt="总结这个项目的目录结构与核心模块，并生成 MINICODE.md"><span class="idx mono">01</span><span class="t">生成项目说明 MINICODE.md</span><span class="arr">→</span></button></li>
          <li><button class="chip" data-prompt="审查本会话最近的代码改动，按严重程度列出问题清单"><span class="idx mono">02</span><span class="t">审查本会话的代码改动</span><span class="arr">→</span></button></li>
          <li><button class="chip" data-prompt="运行项目的测试，如果有失败就自动修复"><span class="idx mono">03</span><span class="t">跑测试并修复失败项</span><span class="arr">→</span></button></li>
          <li><button class="chip" data-prompt="解释这个项目核心模块的设计思路和关键数据流"><span class="idx mono">04</span><span class="t">解释核心模块设计</span><span class="arr">→</span></button></li>
        </ol>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="input-card">
      <textarea id="input" rows="1" placeholder="输入任务…"></textarea>
      <button id="btnSend" class="send" title="发送">↑</button>
    </div>
  </footer>

  <div class="statusbar mono">
    <span class="st"><span id="conn" class="conn"></span><span id="connText">连接中…</span></span>
    <select id="modeSel" title="权限模式">
      <option value="default">确认模式</option>
      <option value="accept-edits">自动接受编辑</option>
      <option value="plan">计划模式</option>
      <option value="full-access">完全访问</option>
    </select>
    <span class="st-right dim" id="usage"></span>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
